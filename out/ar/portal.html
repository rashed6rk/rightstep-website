مصمّم لفريقك ولأهدافك.\",\"body\":\"برامج تدريبية مفصّلة على احتياجات موظفيك وفرق العمل — من التواصل التشغيلي إلى مسارات إعداد القادة.\",\"points\":[\"تحليل احتياجات وتصميم برنامج مخصّص\",\"تنفيذ في مقرّك بأبوظبي أو عن بُعد\",\"تنسيق جماعي أو فردي\",\"متابعة وتعزيز وقياس بعد البرنامج\"]},{\"key\":\"events\",\"title\":\"الفعاليات والبروتوكول\",\"tagline\":\"حضور مهني، على المنصة وخلف الكواليس.\",\"body\":\"نُطوّر فرق الفعاليات والضيافة والبروتوكول بمهارات الحضور والإتيكيت والتواصل المطلوبة على المستويات القيادية — من مقدّمي الفعاليات والميسّرين إلى المنسّقين الميدانيين.\",\"points\":[\"تقديم وإدارة الفعاليات\",\"الضيافة المؤسسية والإتيكيت\",\"الحضور على المنصة وخارجها\",\"التنسيق حول كبار الشخصيات\"]},{\"key\":\"supplier\",\"title\":\"تطوير الموردين\",\"tagline\":\"موردون أقوى، وشراكات أمتن.\",\"body\":\"نبني قدرات التواصل والتفاوض والتنفيذ لدى الموردين الذين يخدمون العملاء المؤسسيين والحكوميين — لتكون العلاقة شراكة حقيقية لا مجرد قائمة طلبات.\",\"points\":[\"التفاوض والتواصل مع أصحاب المصلحة\",\"التحضير للعروض التقديمية والبيتش\",\"وضوح العقد والتسليم\",\"طقوس شراكة تصمد تحت الضغط\"]}]},\"stats\":{\"eyebrow\":\"لماذا يهم هذا\",\"title\":\"المشكلة ليست فيما تعرفه. بل في وصول ما تعرفه.\",\"body\":\"الفجوة بين الأفكار الجيدة وجمهورها فجوة مهارات — والمهارات تُبنى. هذا ما تعيد الأبحاث تأكيده.\",\"items\":[{\"value\":\"٧٠٪\",\"label\":\"من المهنيين يؤكدون أن مهارات التحدث أمام الجمهور ترتبط مباشرة بالتقدم المهني. — LinkedIn\"},{\"value\":\"٧٠٪\",\"label\":\"من تفاعل الفرق يعتمد على أداء المدير المباشر في التواصل والقيادة. — Gallup\"},{\"value\":\"٩٣٪\",\"label\":\"من الانطباع في التواصل العاطفي يتشكّل من نبرة الصوت ولغة الجسد، لا الكلمات. — Mehrabian, UCLA\"},{\"value\":\"٩٢٪\",\"label\":\"من المهنيين يعتبرون مهارات العرض والتقديم عاملًا حاسمًا في النجاح المهني.\"}],\"footnote\":\"\"},\"steps\":{\"eyebrow\":\"منهجيتنا\",\"title\":\"تعلّم. مارس. حسّن. أثّر.\",\"body\":\"لا نسلّمك مستندًا وننصرف. نبقى معك على الممارسة حتى تظهر المهارة ويظهر الأثر.\",\"deliverableLabel\":\"تخرج من هذه الخطوة بـ\",\"cta\":\"ابدأ خطوتك الأولى\",\"items\":[{\"title\":\"تعلّم\",\"body\":\"تفهم المهارة — كيف تعمل، ولماذا، وأين تناسب. محتوى مركّز لأشخاص بالغين لديهم أعمال حقيقية.\",\"deliverable\":\"نموذج ذهني واضح يمكنك شرحه بجملة واحدة\"},{\"title\":\"مارس\",\"body\":\"تستخدم المهارة في بيئة آمنة ومنظّمة. لا محاضرة — بل بروفة. هنا تبدأ الثقة بالبناء.\",\"deliverable\":\"تكرارات حيّة للمهارة، بصوتك أنت\"},{\"title\":\"حسّن\",\"body\":\"تتلقّى ملاحظات مباشرة ولطيفة على ما نجح وما يحتاج تطويرًا. التحسين ما يحوّل الممارسة إلى أداء.\",\"deliverable\":\"ملاحظات محدّدة عمّا تحتفظ به، وتُسقطه، وتُجرّبه لاحقًا\"},{\"title\":\"أثّر\",\"body\":\"تأخذ المهارة إلى الغرفة التي تهمّ — الاجتماع، العرض، المقابلة، الجمهور — وتصل.\",\"deliverable\":\"مهارة يمكنك الإشارة إليها في عملك اليومي\"}]},\"testimonials\":{\"eyebrow\":\"آراء المتدربين\",\"title\":\"إلى أين قادت الخطوة الأولى\",\"note\":\"\",\"items\":[{\"quote\":\"قدّمت كلمات لسنوات، لكن الجلسات ساعدتني على سماع عاداتي الخاصة لأول مرة. الكلمة التالية كانت حوارًا مختلفًا.\",\"name\":\"ف. المرزوقي\",\"role\":\"مديرة برامج — أبوظبي\"},{\"quote\":\"أقمنا ورشة التواصل مع فريق القيادة. بعد ستة أسابيع، أصبحت الاجتماعات نفسها مختلفة — أقصر وأدق وأكثر لطفًا.\",\"name\":\"أ. المنصوري\",\"role\":\"مدير تشغيلي — دبي\"},{\"quote\":\"كنت أتجمّد أمام الغرفة. بعد ثلاث جلسات، ألقيت أول اجتماع عام للشركة دون سيناريو، والفريق أنصت فعلًا.\",\"name\":\"س. نورة\",\"role\":\"رئيسة فريق — أبوظبي\"}]},\"ctaBand\":{\"title\":\"خطوتك التالية محادثة من ٤٥ دقيقة.\",\"body\":\"بلا شرائح وبلا التزام. تقييم قصير لطريقة تحدّثك اليوم، وشيء واحد محدّد للعمل عليه لاحقًا — مكتوب، في الحالتين.\",\"primary\":\"احجز جلسة تقييمك المجانية ٤٥ دقيقة\",\"secondary\":\"أو اتصل +971 55 552 0071\"},\"servicesPage\":{\"hero\":{\"eyebrow\":\"خدماتنا\",\"title\":\"ما نقدّمه\",\"body\":\"ست خدمات تلتقي حول هدف واحد: أن تُظهر مهارتك في المكان الذي يهمّ.\"},\"detail\":{\"whoLabel\":\"لمن هذه الخدمة\",\"includesLabel\":\"ماذا يشمل\",\"outcomeLabel\":\"النتيجة\",\"ctaLabe انون اتحادي رقم ٤٥ لسنة ٢٠٢١ بشأن حماية البيانات الشخصية، ووفق طبيعة عملها، قبل النشر.\",\"contactTitle\":\"أسئلة حول هذه السياسة\",\"contactBody\":\"راسلنا وسنجيب خلال يوم عمل واحد.\",\"privacy\":{\"title\":\"سياسة الخصوصية\",\"lead\":\"نحترم خصوصيتك ونتعامل مع بياناتك بمسؤولية.\",\"sections\":[{\"h\":\"ما نجمعه ولماذا\",\"p\":\"نجمع فقط بيانات التواصل التي تشاركها معنا عبر النماذج (الاسم، البريد، الهاتف) لنرد على استفسارك ونقدّم الخدمة المطلوبة. لا نجمع بيانات دفع — فهي تذهب مباشرة إلى مزوّد الدفع.\"},{\"h\":\"المشاركة والحماية\",\"p\":\"لا نبيع بياناتك ولا نشاركها لأغراض إعلانية. يطّلع عليها فقط من يلزم لتقديم الخدمة (مزوّد الدفع، المحاسب). نستخدم ملفات تعريف ارتباط أساسية فقط لتشغيل الموقع.\"},{\"h\":\"حقوقك\",\"p\":\"يمكنك طلب نسخة من بياناتك، أو تصحيحها، أو حذفها في أي وقت. راسلنا وسنرد خلال ثلاثين يومًا.\"}]},\"terms\":{\"title\":\"شروط الخدمة\",\"lead\":\"الأساس الذي نعمل عليه معًا.\",\"sections\":[{\"h\":\"من نحن\",\"p\":\"الخطوة الصحيحة شركة استشارات أعمال مقرها أبوظبي، الإمارات العربية المتحدة، تقدّم استشارات التجارة الإلكترونية والاستشارات الإدارية واستشارات الموارد البشرية، وتقيم ورشًا عامة وخاصة.\"},{\"h\":\"التعاملات\",\"p\":\"يُتفق على نطاق العمل كتابيًا قبل بدايته، ويحدد المخرجات والأتعاب والمدد ومسؤوليات كل طرف، وله الأولوية على أي شيء منشور في هذا الموقع.\"},{\"h\":\"حجوزات الورش\",\"p\":\"يُؤكَّد المقعد عند استلام المبلغ. والمقاعد قابلة للتحويل إلى زميل في أي وقت. الإلغاء قبل الموعد بأكثر من سبعة أيام يُسترد بالكامل؛ وداخل السبعة أيام يُحفظ المبلغ رصيدًا لجلسة قادمة.\"},{\"h\":\"إذا ألغينا نحن\",\"p\":\"إذا ألغينا ورشة أو أجّلناها، فلك أن تأخذ الموعد الجديد أو استرداد المبلغ كاملًا، أيهما تفضّل.\"},{\"h\":\"الأتعاب والضريبة\",\"p\":\"الأسعار بالدرهم الإماراتي وغير شاملة لضريبة القيمة المضافة ما لم يُذكر خلاف ذلك، وتُحتسب الضريبة بالنسبة السارية في الدولة.\"},{\"h\":\"موادك وموادنا\",\"p\":\"تبقى ملكية كل ما تعطينا إياه لك، وتحصل على حقوق كاملة لاستخدام المخرجات التي ننتجها لك. أما أطرنا ونماذجنا ومواد ورشنا فتبقى ملكنا، وتُرخَّص لك لاستخدامك الخا
