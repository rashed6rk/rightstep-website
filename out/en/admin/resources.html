vents\",\"title\":\"Events \u0026 Protocol\",\"tagline\":\"Professional presence, on the stage and behind the scenes.\",\"body\":\"We equip event, hospitality and protocol teams with the presence, etiquette and communication skills required at senior levels — from MCs and moderators to on-the-ground coordinators.\",\"points\":[\"Event MCing and moderation\",\"Corporate hospitality and etiquette\",\"On-stage and off-stage presence\",\"Coordinating around senior stakeholders\"]},{\"key\":\"supplier\",\"title\":\"Supplier Development\",\"tagline\":\"Sharper suppliers, stronger partnerships.\",\"body\":\"We build the communication, negotiation and delivery capability of suppliers who serve corporate and government clients — so the relationship is a partnership rather than a queue of tickets.\",\"points\":[\"Negotiation and stakeholder communication\",\"Presentation and pitch preparation\",\"Contract and delivery clarity\",\"Partnership rituals that hold up under stress\"]}]},\"stats\":{\"eyebrow\":\"Why this matters\",\"title\":\"The problem isn't what you know. It's whether people hear it.\",\"body\":\"The gap between good ideas and their audience is a skill gap — and skills can be built. Here's what the research keeps finding.\",\"items\":[{\"value\":\"70%\",\"label\":\"of professionals say public speaking skills directly correlate with career advancement. — LinkedIn\"},{\"value\":\"70%\",\"label\":\"of team engagement variance is driven by the direct manager's communication and leadership. — Gallup\"},{\"value\":\"93%\",\"label\":\"of emotional communication impact comes from tone and body language, not words alone. — Mehrabian, UCLA\"},{\"value\":\"92%\",\"label\":\"of professionals consider presentation skills crucial to workplace success.\"}],\"footnote\":\"\"},\"steps\":{\"eyebrow\":\"Our approach\",\"title\":\"Learn. Practice. Improve. Impact.\",\"body\":\"We don't hand you a document and walk away. We stay with you on the practice until the skill shows up — and the impact with it.\",\"deliverableLabel\":\"You leave this step with\",\"cta\":\"Book your first step\",\"items\":[{\"title\":\"Learn\",\"body\":\"You understand the skill — how it works, why it works, and where it fits. Short, high-signal input built for adults with real jobs.\",\"deliverable\":\"A clear mental model you can explain in one sentence\"},{\"title\":\"Practice\",\"body\":\"You use the skill in a safe setting, with structure. Not a lecture — a rehearsal. This is where confidence starts to build.\",\"deliverable\":\"Live reps of the skill, in your own voice\"},{\"title\":\"Improve\",\"body\":\"You get direct, kind feedback on what worked and what to sharpen next. Improvement is what turns practice into performance.\",\"deliverable\":\"Specific notes on what to keep, drop and try next\"},{\"title\":\"Impact\",\"body\":\"You take the skill into the room where it counts — the meeting, the pitch, the interview, the audience — and it lands.\",\"deliverable\":\"A skill you can point to in your daily work\"}]},\"testimonials\":{\"eyebrow\":\"What people say\",\"title\":\"Where the first step led\",\"note\":\"Illustrative testimonials — please replace with cited real testimonials before publishing.\",\"items\":[{\"quote\":\"I've given talks for years, but the sessions helped me hear my own habits for the first time. My next keynote was a different conversation.\",\"name\":\"ف. المرزوقي\",\"role\":\"Programme Director — Abu Dhabi\"},{\"quote\":\"We ran the communication workshop with our leadership team. Six weeks later the meetings themselves are different — shorter, sharper, kinder.\",\"name\":\"أ. المنصوري\",\"role\":\"COO — Dubai\"},{\"quote\":\"I used to freeze in front of a room. After three sessions I did my first company all-hands without a script, and the team actually listened.\",\"name\":\"س. نورة\",\"role\":\"Team Lead — Abu Dhabi\"}]},\"ctaBand\":{\"title\":\"Your next step is a 45-minute conversation.\",\"body\":\"No slides, no obligation. A short
